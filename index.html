<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Formature um Médico - UFS</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
  font-family:'Segoe UI',sans-serif;
  background:radial-gradient(circle at top,#0f1c2e,#08111d 70%);
  color:#f5f5f5;
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
}

.container{
  max-width:900px;
  width:100%;
  background:rgba(255,255,255,0.04);
  backdrop-filter:blur(25px);
  border-radius:30px;
  padding:50px;
  box-shadow:0 40px 80px rgba(0,0,0,0.7);
  text-align:center;
  position:relative;
  overflow:hidden;
}

/* ALERTA */
.alert{
  background:linear-gradient(90deg,#ff0000,#8b0000,#ff0000);
  padding:16px;
  border-radius:18px;
  font-weight:900;
  font-size:20px;
  margin-bottom:20px;
  letter-spacing:1px;
  animation:alertEmergency 0.6s infinite;
}

/* PISCAR FORTE COM LUZ */
@keyframes alertEmergency{
  0%{
    background:linear-gradient(90deg,#ff0000,#8b0000,#ff0000);
    box-shadow:
      0 0 10px #ff0000,
      0 0 20px #ff0000,
      0 0 40px #ff0000;
    transform:scale(1);
  }
  50%{
    background:linear-gradient(90deg,#ff3b3b,#b30000,#ff3b3b);
    box-shadow:
      0 0 25px #ff0000,
      0 0 50px #ff0000,
      0 0 80px #ff0000,
      0 0 120px #ff0000;
    transform:scale(1.04);
  }
  100%{
    background:linear-gradient(90deg,#ff0000,#8b0000,#ff0000);
    box-shadow:
      0 0 10px #ff0000,
      0 0 20px #ff0000,
      0 0 40px #ff0000;
    transform:scale(1);
  }
}
/* FOTO */
.photo{
  width:220px;
  height:220px;
  border-radius:50%;
  overflow:hidden;
  margin:0 auto 3px;
  box-shadow:0 0 40px rgba(255,215,0,0.6);
  border:4px solid rgba(255,215,0,0.4);
}

.photo img{
  width:100%;
  height:100%;
  object-fit:cover;
}

/* TÍTULO */
h1{
  font-size:36px;
  margin-bottom:10px;
  color:#ffd700;
}

.subtitle{
  font-size:21.5px;
font-weight:700;
  opacity:0.85;
  margin-bottom:5px;
}

/* VALOR PRINCIPAL */
.value{
  font-size:30px;
  font-weight:900;
  color:#ffd700;
  margin-bottom:0px;
}

/* PROGRESSO */
.progress-container{
  width:100%;
  height:20px;
  background:rgba(255,255,255,0.1);
  border-radius:30px;
  overflow:hidden;
  margin:2px 0;
}

.progress-bar{
  height:100%;
  width:0%;
  background:linear-gradient(90deg,#ffd700,#ffb300);
  border-radius:30px;
}

/* STATS */
.stats{
  font-size:18px;
  line-height:1.8;
  margin-bottom:5px;
}

.emotional{
  font-size:20px;
  margin-bottom:30px;
  line-height:1.6;
  opacity:0.9;
}

/* PIX */
.pix-box{
  width:70%;
  margin: 0 auto;
  transform:scale(1.05);
  box-shadow:0 0 10px #ffd700;
  background:rgba(255,215,0,0.08);
  padding:15px;
  border-radius:20px;
  margin-bottom:15px;
  font-size:18px;
  border:1px solid rgba(255,215,0,0.9);
  transition:.3s;
  position:relative;

  /* 🔥 CORREÇÃO IMPORTANTE */
  overflow-wrap: anywhere;
  word-break: break-word;
}

/* BOTÃO */
button{
  width:30%;
  padding:18px;
  border:none;
  border-radius:20px;
  font-size:18px;
  font-weight:bold;
  background:linear-gradient(90deg,#ffd700,#ffb300);
  color:#0f1c2e;
  cursor:pointer;
  transition:.3s;
}

button:hover{
  transform:scale(1.03);
  box-shadow:0 0 30px #ffd700;
}

.footer{
  margin-top:35px;
  font-size:14px;
  opacity:0.7;
}

.progress-container{
  position:relative;
}

.progress-bar{
  position:relative;
  overflow:hidden;
}

/* TEXTO SOBRE A BARRA */
.progress-container{
  position:relative;
}

.progress-text{
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  font-weight:900;
  font-size:14px;
  white-space:nowrap; /* força linha única */
  opacity:0;
  pointer-events:none;
  color:#1a1a1a;
  z-index:2;
}

/* OURO DERRETIDO */
.progress-bar.completed{
  background:linear-gradient(
    120deg,
    #ffd700 0%,
    #fff8dc 25%,
    #ffb300 50%,
    #fff8dc 75%,
    #ffd700 100%
  );
  background-size:300% 100%;
  animation:goldFlow 3s linear infinite;
}

@keyframes goldFlow{
  0%{background-position:0% 0;}
  100%{background-position:300% 0;}
}

.progress-container.completed .progress-text{
  opacity:1;
  animation:goldPulse 1.2s infinite alternate;
}

@keyframes goldPulse{
  from{
    text-shadow:0 0 5px #ffd700;
  }
  to{
    text-shadow:
      0 0 10px #ffd700,
      0 0 20px #ffb300,
      0 0 30px #ffd700;
  }
}

/* ======================================
   RESPONSIVIDADE PARA CELULAR E TABLET
   ====================================== */

/* Tablet */
@media (max-width: 1024px){

  .container{
    padding:30px;
  }

  .photo{
    width:180px;
    height:180px;
    margin-bottom:20px;
  }

  h1{
    font-size:28px;
  }

  .subtitle{
    font-size:16px;
    margin-bottom:25px;
  }

  .value{
    font-size:42px;
  }

  .stats{
    font-size:16px;
    margin-bottom:20px;
  }

  .emotional{
    font-size:16px;
    margin-bottom:20px;
  }

  .pix-box{
    font-size:16px;
    padding:15px;
  }

  button{
    padding:14px;
    font-size:16px;
  }

}

/* Celular */
@media (max-width: 600px){

  body{
    padding:10px;
  }

  .container{
    padding:20px;
    border-radius:20px;
  }

  .alert{
    font-size:13px;
    padding:12px;
    margin-bottom:20px;
  }

  .photo{
    width:140px;
    height:140px;
    margin-bottom:15px;
  }

  h1{
    font-size:22px;
  }

  .subtitle{
    font-size:14px;
    margin-bottom:20px;
  }

  .value{
    font-size:32px;
  }

  .progress-container{
    height:14px;
    margin:15px 0;
  }

  .progress-text{
    font-size:11px;
  }

  .stats{
    font-size:14px;
    margin-bottom:15px;
  }

  .emotional{
    font-size:14px;
    margin-bottom:15px;
  }

  .pix-box{
    font-size:14px;
    padding:12px;
  }

  button{
    padding:12px;
    font-size:14px;
  }

  .footer{
    font-size:12px;
    margin-top:20px;
  }

}

</style>
</head>

<body>

<div class="container">

<div class="alert">
🚨 Estamos há <span id="timeWithoutDonation"></span> sem doações. SUA AJUDA MUDA ISSO.
</div>

<div class="photo">
<img src="SUA_FOTO_AQUI.jpg">
</div>

<h1>FORMATURE UM MÉDICO</h1>
<div class="subtitle">Medicina • UFS</div>

<div class="value">R$ 2.614,59</div>

<div class="progress-container">
  <div class="progress-bar" id="bar"></div>
  <div class="progress-text" id="progressText">
      29,83% arrecadados
  </div>
</div>

<div class="stats">
Meta: R$ 8.765,00   •   Faltam: <strong>R$ 6.150,41</strong><br>
</div> <div class="emotional"> Cada contribuição é um passo para transformar esforço em conquista. Deus nos abençoe!
</div>

<div class="pix-box">
CHAVE PIX<br>
<strong>medicinacarlosjose@gmail.com</strong>
</div>

<button onclick="copyPix()">Doar Agora</button>
</div>
<script>

/* CONTADOR */
const lastDonation = new Date("2026-02-28T17:29:00-03:00");

function updateCounter(){
  const now = new Date();
  const diff = now - lastDonation;

  const days = Math.floor(diff / (1000*60*60*24));
  const hours = Math.floor((diff / (1000*60*60)) % 24);
  const minutes = Math.floor((diff / (1000*60)) % 60);
  const seconds = Math.floor((diff / 1000) % 60);

  document.getElementById("timeWithoutDonation")
  .innerText = `${days}d ${hours}h ${minutes}m ${seconds}s`;
}

setInterval(updateCounter,1000);
updateCounter();

/* BARRA */

const bar = document.getElementById("bar");
const target = 29.83;

function animateBar(){
  bar.style.transition = "width 2.5s ease";
  bar.style.width = target + "%";

  setTimeout(()=>{
      bar.classList.add("completed");
      document.querySelector(".progress-container")
              .classList.add("completed");
  }, 2600);
}

animateBar();

/* COPIAR PIX */
function copyPix(){
  navigator.clipboard.writeText("medicinacarlosjose@gmail.com");
  alert("Chave PIX copiada!");
}

</script>

</body>
</html>
