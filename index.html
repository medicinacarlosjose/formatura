<style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap');

    @keyframes celebrate {
        0% { transform: scale(0.95); opacity: 0; }
        100% { transform: scale(1); opacity: 1; }
    }
    @keyframes float {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-10px); }
    }

    .dynamic-card {
        animation: celebrate 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        font-family: 'Inter', sans-serif;
        /* Ajuste para Mobile */
        width: 92%;
        max-width: 550px;
        margin: 20px auto;
        box-sizing: border-box;
    }

    .floating-icon {
        display: inline-block;
        animation: float 3s ease-in-out infinite;
    }

    /* Ajustes finos para telas menores que 480px */
    @media (max-width: 480px) {
        .dynamic-card { padding: 40px 20px !important; }
        .main-title { font-size: 1.8rem !important; }
        .amount-text { font-size: 2.8rem !important; }
        .currency { font-size: 1.2rem !important; }
    }
</style>

<div class="dynamic-card" style="
    background: linear-gradient(135deg, rgba(255, 240, 245, 0.9), rgba(230, 230, 250, 0.9));
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(255, 255, 255, 0.6);
    padding: 60px 40px;
    border-radius: 30px;
    text-align: center;
    box-shadow: 0 20px 40px rgba(121, 40, 202, 0.15);
    position: relative;
    overflow: hidden;
">
    
    <div style="
        display: inline-block;
        background: #FFD700;
        color: #000;
        padding: 6px 18px;
        border-radius: 50px;
        font-size: 0.7rem;
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: 2px;
        margin-bottom: 20px;
        box-shadow: 0 4px 10px rgba(255, 215, 0, 0.3);
    ">
        Deus abençoe!
    </div>

    <h2 class="main-title" style="
        font-weight: 700;
        font-size: 2.2rem;
        margin-bottom: 15px;
        color: #1d1d1f;
        line-height: 1.2;
    ">
        Juntos, fizemos <br/> 
        <span style="background: linear-gradient(120deg, #ff0080, #7928ca); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">
            acontecer!
        </span>
    </h2>

    <p style="color: #4b4b4b; font-size: 1rem; margin-bottom: 25px; font-weight: 400; line-height: 1.5;">
        Obrigado por cada contribuição. Não alcançamos a meta da Formatura, mas alcançamos a meta da união e solidariedade.
    </p>

    <div style="
        background: rgba(121, 40, 202, 0.07);
        padding: 25px 15px;
        border-radius: 20px;
        display: block;
        width: 100%;
        max-width: 320px;
        margin: 0 auto;
        border: 2px solid rgba(121, 40, 202, 0.15);
        box-sizing: border-box;
    ">
        <span style="font-size: 1rem; color: #7928ca; font-weight: 700; display: block; margin-bottom: 5px; letter-spacing: 1px;">CAMPANHA ENCERRADA.<br/> 
        <span style="background: linear-gradient(120deg, #ff0080, #7928ca); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">
            TOTAL FINAL
</span>
        <div class="amount-text" style="font-size: 3.5rem; font-weight: 800; color: #1a1a1a; letter-spacing: -1.5px; white-space: nowrap;">
            <span class="currency" style="font-size: 1.5rem; vertical-align: middle; font-weight: 400; margin-right: 2px;">R$</span>2.727,59
        </div>
    </div>

    <div style="margin-top: 35px; border-top: 1px solid rgba(0,0,0,0.05); padding-top: 20px;">
        <span class="floating-icon" style="font-size: 1.6rem;">✨</span>
        <p style="font-size: 0.9rem; color: #2d3436; font-weight: 600; margin-top: 8px; padding: 0 10px;">
            Este valor reflete a força da nossa comunidade.
        </p>
    </div>
</div>
