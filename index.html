<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Formature um Médico - UFS</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
  font-family:'Segoe UI',sans-serif;
  background:radial-gradient(circle at top,#0f1c2e,#08111d 70%);
  color:#f5f5f5;
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
}

.container{
  max-width:900px;
  width:100%;
  background:rgba(255,255,255,0.04);
  backdrop-filter:blur(25px);
  border-radius:30px;
  padding:50px;
  box-shadow:0 40px 80px rgba(0,0,0,0.7);
  text-align:center;
  position:relative;
  overflow:hidden;
}

/* ALERTA */
.alert{
  background:linear-gradient(90deg,#ff0000,#8b0000,#ff0000);
  padding:16px;
  border-radius:18px;
  font-weight:900;
  font-size:20px;
  margin-bottom:20px;
  letter-spacing:1px;
  animation:alertEmergency 0.6s infinite;
}

@keyframes alertEmergency{
  0%{
    background:linear-gradient(90deg,#ff0000,#8b0000,#ff0000);
    box-shadow: 0 0 10px #ff0000, 0 0 20px #ff0000, 0 0 40px #ff0000;
    transform:scale(1);
  }
  50%{
    background:linear-gradient(90deg,#ff3b3b,#b30000,#ff3b3b);
    box-shadow: 0 0 25px #ff0000, 0 0 50px #ff0000, 0 0 80px #ff0000, 0 0 120px #ff0000;
    transform:scale(1.04);
  }
  100%{
    background:linear-gradient(90deg,#ff0000,#8b0000,#ff0000);
    box-shadow: 0 0 10px #ff0000, 0 0 20px #ff0000, 0 0 40px #ff0000;
    transform:scale(1);
  }
}

.photo{
  width:220px;
  height:220px;
  border-radius:50%;
  overflow:hidden;
  margin:0 auto 3px;
  box-shadow:0 0 40px rgba(255,215,0,0.6);
  border:4px solid rgba(255,215,0,0.4);
}

.photo img{
  width:100%;
  height:100%;
  object-fit:cover;
}

h1{
  font-size:36px;
  margin-bottom:10px;
  color:#ffd700;
}

.subtitle{
  font-size:21.5px;
  font-weight:700;
  opacity:0.85;
  margin-bottom:5px;
}

.value{
  font-size:30px;
  font-weight:900;
  color:#ffd700;
  margin-bottom:0px;
}

.progress-container{
  width:100%;
  height:20px;
  background:rgba(255,255,255,0.1);
  border-radius:30px;
  overflow:hidden;
  margin:2px 0;
  position:relative;
}

.progress-bar{
  height:100%;
  width:0%;
  background:linear-gradient(90deg,#ffd700,#ffb300);
  border-radius:30px;
  position:relative;
  overflow:hidden;
}

.stats{
  font-size:18px;
  line-height:1.8;
  margin-bottom:5px;
}

.emotional{
  font-size:20px;
  margin-bottom:30px;
  line-height:1.6;
  opacity:0.9;
}

.pix-box{
  width:70%;
  margin: 0 auto;
  transform:scale(1.05);
  box-shadow:0 0 10px #ffd700;
  background:rgba(255,215,0,0.08);
  padding:15px;
  border-radius:20px;
  margin-bottom:15px;
  font-size:18px;
  border:1px solid rgba(255,215,0,0.9);
  transition:.3s;
  position:relative;
  overflow-wrap: anywhere;
  word-break: break-word;
}

button{
  width:30%;
  padding:18px;
  border:none;
  border-radius:20px;
  font-size:18px;
  font-weight:bold;
  background:linear-gradient(90deg,#ffd700,#ffb300);
  color:#0f1c2e;
  cursor:pointer;
  transition:.3s;
}

button:hover{
  transform:scale(1.03);
  box-shadow:0 0 30px #ffd700;
}

.progress-text{
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  font-weight:900;
  font-size:14px;
  white-space:nowrap;
  opacity:0;
  pointer-events:none;
  color:#1a1a1a;
  z-index:2;
}

.progress-bar.completed{
  background:linear-gradient(120deg, #ffd700 0%, #fff8dc 25%, #ffb300 50%, #fff8dc 75%, #ffd700 100%);
  background-size:300% 100%;
  animation:goldFlow 3s linear infinite;
}

@keyframes goldFlow{
  0%{background-position:0% 0;}
  100%{background-position:300% 0;}
}

.progress-container.completed .progress-text{
  opacity:1;
  animation:goldPulse 1.2s infinite alternate;
}

@keyframes goldPulse{
  from{ text-shadow:0 0 5px #ffd700; }
  to{ text-shadow: 0 0 10px #ffd700, 0 0 20px #ffb300, 0 0 30px #ffd700; }
}

/* Responsividade */
@media (max-width: 600px){
  .container{ padding:20px; border-radius:20px; }
  .alert{ font-size:13px; padding:12px; }
  .photo{ width:140px; height:140px; }
  h1{ font-size:22px; }
  .value{ font-size:32px; }
  .pix-box{ width:90%; font-size:14px; }
  button{ width:60%; }
}
</style>
</head>

<body>

<div class="container">
<div class="alert">
🚨 Estamos há <span id="timeWithoutDonation"></span> sem doações. SUA AJUDA MUDA ISSO.
</div>

<div class="photo">
<img src="SUA_FOTO_AQUI.jpg" alt="Foto">
</div>

<h1>FORMATURE UM MÉDICO</h1>
<div class="subtitle">Medicina • UFS</div>

<div class="value">R$ 2.715,59</div>

<div class="progress-container">
  <div class="progress-bar" id="bar"></div>
  <div class="progress-text" id="progressText">
      30,98% arrecadados
  </div>
</div>

<div class="stats">
Meta R$ 8.765,00 • Faltam <strong>R$ 6.049,41</strong><br>
</div> 

<div class="emotional"> 
Cada contribuição é um passo para transformar esforço em conquista. Deus nos abençoe!
</div>

<div class="pix-box">
CHAVE PIX<br>
<strong>medicinacarlosjose@gmail.com</strong>
</div>

<button onclick="copyPix()">Doar Agora</button>
</div>

<script>
/* CONTADOR - Atualizado para 04/03/2026 às 14:13 */
const lastDonation = new Date("2026-03-06T21:15:00-03:00");

function updateCounter(){
  const now = new Date();
  const diff = now - lastDonation;

  if (diff < 0) {
      document.getElementById("timeWithoutDonation").innerText = "0d 0h 0m 0s";
      return;
  }

  const days = Math.floor(diff / (1000*60*60*24));
  const hours = Math.floor((diff / (1000*60*60)) % 24);
  const minutes = Math.floor((diff / (1000*60)) % 60);
  const seconds = Math.floor((diff / 1000) % 60);

  document.getElementById("timeWithoutDonation")
  .innerText = `${days}d ${hours}h ${minutes}m ${seconds}s`;
}

setInterval(updateCounter,1000);
updateCounter();

/* BARRA - Atualizada para 30.70% */
const bar = document.getElementById("bar");
const target = 30.98;

function animateBar(){
  bar.style.transition = "width 2.5s ease";
  bar.style.width = target + "%";

  setTimeout(()=>{
      bar.classList.add("completed");
      document.querySelector(".progress-container").classList.add("completed");
  }, 2600);
}

animateBar();

function copyPix(){
  navigator.clipboard.writeText("medicinacarlosjose@gmail.com");
  alert("Chave PIX copiada!");
}
</script>

</body>
</html>
