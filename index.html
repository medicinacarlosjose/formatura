<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Formature um Médico - UFS</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:'Segoe UI',Arial;
background:radial-gradient(circle at top,#0f1c2e,#08111d 70%);
color:#ffffff;

height:100vh;
display:flex;
justify-content:center;
align-items:center;

padding:10px;
}

/* CONTAINER */

.container{

position:relative;

width:100%;
max-width:750px;

height:100%;
max-height:900px;

background:#132235;

border-radius:22px;

padding:20px;

display:flex;
flex-direction:column;
justify-content:space-between;

text-align:center;

overflow:hidden;
}

/* CANVAS ESTRELAS */

#stars{
position:absolute;
top:0;
left:0;
width:100%;
height:100%;
pointer-events:none;
}

/* TITULOS */

h1{
font-size:clamp(20px,3vw,32px);
color:#ffd700;
}

.subtitle{
font-size:clamp(14px,2vw,18px);
opacity:.85;
margin-bottom:6px;
}

/* TARJA ALERTA */

.alert-banner{
background:#ff0000;
color:white;
font-weight:900;
letter-spacing:1px;
padding:8px 14px;
border-radius:10px;
width:max-content;
margin:6px auto;

animation:blink 1s infinite;
}

@keyframes blink{
0%{background:#ff0000;box-shadow:0 0 8px #ff0000;}
50%{background:#ff3b3b;box-shadow:0 0 20px #ff0000;}
100%{background:#ff0000;box-shadow:0 0 8px #ff0000;}
}

/* CONTADOR */

.countdown-grid{
display:flex;
justify-content:center;
gap:8px;
}

.time-box{

background:#0d1a2a;
border-radius:10px;

padding:8px 12px;

min-width:60px;

border:2px solid #ffd700;

box-shadow:
0 0 8px rgba(255,215,0,0.6),
0 0 15px rgba(255,215,0,0.5);

}

.time-box span{

font-size:clamp(18px,4vw,28px);
font-weight:900;
color:#ffd700;

display:block;

text-shadow:
0 0 8px #ffd700;

}

.time-box small{
font-size:10px;
opacity:.8;
}

/* GIF */

.gif{

width:clamp(120px,40vw,200px);
margin:auto;

border-radius:14px;
overflow:hidden;

border:2px solid rgba(255,215,0,0.5);

box-shadow:0 0 18px rgba(255,215,0,0.4);

}

.gif img{
width:100%;
display:block;
}

/* VALOR */

.amount{
font-size:clamp(22px,4vw,30px);
font-weight:900;
color:#ffd700;
}

/* PORCENTAGEM */

.percent{
font-weight:700;
font-size:14px;
}

/* BARRA */

.progress-track{

width:90%;
margin:6px auto;

height:14px;

background:#3b4654;
border-radius:50px;
overflow:hidden;

}

.progress-fill{

height:100%;
width:0%;

background:linear-gradient(90deg,#ffc400,#ffd900,#ffc400);

}

/* META */

.goal{
font-size:14px;
}

/* TEXTO */

.message{
font-size:14px;
opacity:.9;
}

/* PIX */

.pix{

width:90%;
margin:auto;

background:#0f1e2f;

border:2px solid #ffd700;

border-radius:16px;

padding:12px;

}

.pix strong{
font-size:14px;
}

/* BOTÃO */

button{

width:180px;

margin:auto;

padding:12px;

font-size:15px;
font-weight:700;

border:none;
border-radius:12px;

background:linear-gradient(90deg,#ffd700,#ffb300);

cursor:pointer;

color:#0b1624;

}

button:hover{
transform:scale(1.05);
box-shadow:0 0 20px #ffd700;
}

</style>
</head>

<body>

<div class="container">

<canvas id="stars"></canvas>

<div>

<h1>FORMATURE UM MÉDICO</h1>

<div class="subtitle">
Medicina • UFS
</div>

<div class="alert-banner">
⏳ PRAZO FINAL DA CAMPANHA
</div>

</div>

<div class="countdown-grid">

<div class="time-box">
<span id="days">00</span>
<small>DIAS</small>
</div>

<div class="time-box">
<span id="hours">00</span>
<small>HORAS</small>
</div>

<div class="time-box">
<span id="minutes">00</span>
<small>MIN</small>
</div>

<div class="time-box">
<span id="seconds">00</span>
<small>SEG</small>
</div>

</div>

<div class="gif">
<img src="tenor.gif">
</div>

<div>

<div class="amount">
R$ 2.715,59
</div>

<div class="percent">
30,98% arrecadados
</div>

<div class="progress-track">
<div class="progress-fill" id="bar"></div>
</div>

<div class="goal">
Meta R$ 8.765,00 • Faltam <strong>R$ 6.049,41</strong>
</div>

</div>

<div class="message">
A torcida de cada um foi a principal vitória. Obrigado a todos. Deus abençoe cada um!
</div>

<div class="pix">
CHAVE PIX<br>
<strong>medicinacarlosjose@gmail.com</strong>
</div>

<button onclick="copyPix()">Doar Agora</button>

</div>

<script>

/* CONTADOR */

const deadline = new Date("2026-03-14T19:00:00-03:00");

function updateCountdown(){

const now = new Date();
const diff = deadline - now;

if(diff<=0) return;

const d=Math.floor(diff/(1000*60*60*24));
const h=Math.floor((diff/(1000*60*60))%24);
const m=Math.floor((diff/(1000*60))%60);
const s=Math.floor((diff/1000)%60);

document.getElementById("days").innerText=d.toString().padStart(2,"0");
document.getElementById("hours").innerText=h.toString().padStart(2,"0");
document.getElementById("minutes").innerText=m.toString().padStart(2,"0");
document.getElementById("seconds").innerText=s.toString().padStart(2,"0");

}

setInterval(updateCountdown,1000);
updateCountdown();

/* BARRA */

const bar=document.getElementById("bar");

let progress=0;
const target=30.98;

const anim=setInterval(()=>{

if(progress>=target){
clearInterval(anim);
return;
}

progress+=0.2;
bar.style.width=progress+"%";

},15);

/* PIX */

function copyPix(){

navigator.clipboard.writeText("medicinacarlosjose@gmail.com");

const btn=document.querySelector("button");

btn.innerText="PIX COPIADO ✓";

setTimeout(()=>{
btn.innerText="Doar Agora";
},2000);

}

/* ESTRELAS */

const canvas=document.getElementById("stars");
const ctx=canvas.getContext("2d");

let stars=[];

function resize(){
canvas.width=canvas.offsetWidth;
canvas.height=canvas.offsetHeight;
}

window.addEventListener("resize",resize);
resize();

for(let i=0;i<70;i++){
stars.push({
x:Math.random()*canvas.width,
y:Math.random()*canvas.height,
size:Math.random()*2+1,
speed:Math.random()*0.7+0.2
});
}

function draw(){

ctx.clearRect(0,0,canvas.width,canvas.height);

ctx.fillStyle="#cfd8dc";

stars.forEach(star=>{

ctx.beginPath();
ctx.arc(star.x,star.y,star.size,0,Math.PI*2);
ctx.fill();

star.y+=star.speed;

if(star.y>canvas.height){
star.y=0;
star.x=Math.random()*canvas.width;
}

});

requestAnimationFrame(draw);

}

draw();

</script>

</body>
</html>
